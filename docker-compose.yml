services:
  timescaledb:
    image: timescale/timescaledb:2.14.2-pg14
    container_name: timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-upbit}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ${PROJECT_ROOT:-.}/initdb:/docker-entrypoint-initdb.d:ro
    restart: always
    networks:
      - monitor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-upbit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  collector:
    build:
      context: .
    container_name: upbit-collector
    command: ["python", "collector.py"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-upbit}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      UPBIT_MARKETS_FILE: /app/markets.txt
      MARKET_REFRESH_CHECK_INTERVAL_SECONDS: ${MARKET_REFRESH_CHECK_INTERVAL_SECONDS:-5}
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ${PROJECT_ROOT:-.}/markets.txt:/app/markets.txt
      - ${PROJECT_ROOT:-.}/list.txt:/app/list.txt
    restart: unless-stopped
    networks:
      - monitor

  market-sync:
    build:
      context: .
    container_name: upbit-market-sync
    command: ["python", "market_sync.py"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-upbit}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      UPBIT_MARKETS_FILE: /app/markets.txt
      UPBIT_MARKET_LIST_FILE: /app/list.txt
      MARKET_CAP_LIMIT_KRW: ${MARKET_CAP_LIMIT_KRW:-1000000000000}
      MARKET_CAP_USDKRW: ${MARKET_CAP_USDKRW:-1350}
      MARKET_INCLUDE_UNKNOWN: ${MARKET_INCLUDE_UNKNOWN:-true}
      MARKET_REFRESH_INTERVAL_SECONDS: ${MARKET_REFRESH_INTERVAL_SECONDS:-86400}
      MARKET_REFRESH_FAILURE_RETRY_SECONDS: ${MARKET_REFRESH_FAILURE_RETRY_SECONDS:-300}
      MARKET_REFRESH_REQUEST_TIMEOUT_SECONDS: ${MARKET_REFRESH_REQUEST_TIMEOUT_SECONDS:-20}
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ${PROJECT_ROOT:-.}/markets.txt:/app/markets.txt
      - ${PROJECT_ROOT:-.}/list.txt:/app/list.txt
    restart: unless-stopped
    networks:
      - monitor

  detector:
    build:
      context: .
    container_name: upbit-detector
    command: ["python", "detector.py"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-upbit}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALERT_RATIO_5M_VS_1H: ${ALERT_RATIO_5M_VS_1H:-2.2}
      ALERT_TPS_MULTIPLIER: ${ALERT_TPS_MULTIPLIER:-1.5}
      ALERT_PRICE_CHANGE_PCT_MAX: ${ALERT_PRICE_CHANGE_PCT_MAX:-2.0}
      ALERT_1H_AVG_TRADE_VALUE_MIN: ${ALERT_1H_AVG_TRADE_VALUE_MIN:-1000000000}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-300}
      DETECTOR_INTERVAL_SECONDS: ${DETECTOR_INTERVAL_SECONDS:-10}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitor

  detector-web:
    build:
      context: .
    container_name: upbit-detector-web
    command: ["python", "detector_web.py"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-upbit}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DETECTOR_WEB_USERNAME: ${DETECTOR_WEB_USERNAME:-admin}
      DETECTOR_WEB_PASSWORD: ${DETECTOR_WEB_PASSWORD:-change-me}
      DETECTOR_WEB_HOST: 0.0.0.0
      DETECTOR_WEB_PORT: 5000
      ALERT_RATIO_5M_VS_1H: ${ALERT_RATIO_5M_VS_1H:-2.2}
      ALERT_TPS_MULTIPLIER: ${ALERT_TPS_MULTIPLIER:-1.5}
      ALERT_PRICE_CHANGE_PCT_MAX: ${ALERT_PRICE_CHANGE_PCT_MAX:-2.0}
      ALERT_1H_AVG_TRADE_VALUE_MIN: ${ALERT_1H_AVG_TRADE_VALUE_MIN:-1000000000}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-300}
      DETECTOR_INTERVAL_SECONDS: ${DETECTOR_INTERVAL_SECONDS:-10}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      UPBIT_MARKETS_FILE: /app/markets.txt
      UPBIT_MARKET_LIST_FILE: /app/list.txt
      MARKET_CAP_LIMIT_KRW: ${MARKET_CAP_LIMIT_KRW:-1000000000000}
      MARKET_CAP_USDKRW: ${MARKET_CAP_USDKRW:-1350}
      MARKET_INCLUDE_UNKNOWN: ${MARKET_INCLUDE_UNKNOWN:-true}
      MARKET_REFRESH_INTERVAL_SECONDS: ${MARKET_REFRESH_INTERVAL_SECONDS:-86400}
      MARKET_REFRESH_FAILURE_RETRY_SECONDS: ${MARKET_REFRESH_FAILURE_RETRY_SECONDS:-300}
      MARKET_REFRESH_REQUEST_TIMEOUT_SECONDS: ${MARKET_REFRESH_REQUEST_TIMEOUT_SECONDS:-20}
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ${PROJECT_ROOT:-.}/markets.txt:/app/markets.txt
      - ${PROJECT_ROOT:-.}/list.txt:/app/list.txt
    restart: unless-stopped
    networks:
      - monitor

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost}
      POSTGRES_DB: ${POSTGRES_DB:-upbit}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ${PROJECT_ROOT:-.}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${PROJECT_ROOT:-.}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitor

  nginx:
    image: nginx:1.27-alpine
    container_name: upbit-nginx
    ports:
      - "80:80"
    volumes:
      - ${PROJECT_ROOT:-.}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      grafana:
        condition: service_started
      detector-web:
        condition: service_started
    restart: unless-stopped
    networks:
      - monitor

networks:
  monitor:
    driver: bridge

volumes:
  timescale_data:
  grafana_data:
